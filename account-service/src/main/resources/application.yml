server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: account-service
  config:
    import: optional:classpath:paywave-resilience.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/account_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:paywave}
    password: ${DB_PASSWORD:paywave_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

paywave:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-paywave-jwt-secret-change-me-32b}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}
    cors-origins: ${CORS_ORIGINS:*}
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
  clients:
    wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.paywave: INFO
