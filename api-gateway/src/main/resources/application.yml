server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        - id: web-ui
          order: -100
          uri: ${WEB_UI_URL:http://localhost:8090}
          predicates:
            - Path=/,/index.html,/css/**,/js/**
        - id: account-auth
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: account-users
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: account-notifications
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/notifications/**
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/wallets/**
        - id: wallet-ledger
          uri: ${WALLET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/ledger/**
        - id: payment-payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**
        - id: payment-transactions
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/transactions/**
        - id: payment-merchants
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/merchants/**
        - id: payment-refunds
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/refunds/**
        - id: settlement-service
          uri: ${SETTLEMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/settlements/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ORIGINS:*}"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: X-Correlation-Id
paywave:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-paywave-jwt-secret-change-me-32b}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
  gateway:
    auth-rate-limit-per-minute: ${GATEWAY_AUTH_RATE_LIMIT:20}
    rate-limit-per-minute: ${GATEWAY_RATE_LIMIT:120}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
