<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">PayWave AWS Target Architecture</title>
  <desc id="desc">ALB, EKS, RDS, ECR, GitOps with Argo CD, Jenkins CI with SonarQube and Trivy.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00baf2"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="s" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="1000" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#bar)"/>
  <text x="48" y="48" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="700" fill="#0b1220">PayWave on AWS</text>
  <text x="48" y="82" font-family="system-ui,sans-serif" font-size="17" fill="#475569">Target platform · Terraform · EKS · GitOps · Jenkins quality gates</text>
  <text x="1150" y="48" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Portfolio / production-style layout</text>

  <!-- Internet / users -->
  <g filter="url(#s)">
    <rect x="48" y="120" width="180" height="72" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="138" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0b1220">Users</text>
    <text x="138" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">xyz.com · HTTPS</text>
  </g>
  <line x1="228" y1="156" x2="288" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Route53 + ACM -->
  <g filter="url(#s)">
    <rect x="288" y="108" width="140" height="96" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
    <text x="358" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e65100">Route 53</text>
    <text x="358" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">DNS</text>
    <text x="358" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">ACM TLS</text>
  </g>
  <line x1="428" y1="156" x2="488" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- VPC frame -->
  <rect x="488" y="100" width="664" height="520" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="0"/>
  <text x="512" y="132" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#312e81">VPC (Terraform)</text>
  <text x="900" y="132" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">2 public + 2 private subnets · NAT · IGW</text>

  <!-- Public subnet ALB -->
  <rect x="512" y="152" width="620" height="100" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="532" y="178" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#166534">Public subnets</text>
  <g filter="url(#s)">
    <rect x="560" y="190" width="200" height="48" rx="8" fill="#fff" stroke="#22c55e"/>
    <text x="660" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0b1220">Application Load Balancer</text>
  </g>
  <text x="800" y="218" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Only :443 ’ Ingress</text>

  <!-- Private EKS -->
  <rect x="512" y="268" width="620" height="332" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="532" y="296" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#312e81">Private subnets · Amazon EKS</text>

  <g filter="url(#s)">
    <rect x="536" y="316" width="160" height="52" rx="8" fill="#e0f7fe" stroke="#00baf2" stroke-width="2"/>
    <text x="616" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b1220">Ingress</text>
  </g>
  <line x1="696" y1="342" x2="736" y2="342" stroke="#64748b" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="736" y="312" width="180" height="60" rx="8" fill="#e0f7fe" stroke="#00baf2" stroke-width="2"/>
    <text x="826" y="338" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b1220">api-gateway</text>
    <text x="826" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">+ embedded demo UI</text>
  </g>

  <!-- Pods grid -->
  <g font-family="system-ui,sans-serif" font-size="11" filter="url(#s)">
    <rect x="536" y="400" width="110" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="591" y="427" text-anchor="middle" font-weight="600">account ×2</text>
    <rect x="662" y="400" width="110" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="717" y="427" text-anchor="middle" font-weight="600">wallet ×2</text>
    <rect x="788" y="400" width="110" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="843" y="427" text-anchor="middle" font-weight="600">payment ×2</text>
    <rect x="914" y="400" width="110" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="969" y="427" text-anchor="middle" font-weight="600">settlement ×2</text>
  </g>
  <text x="536" y="468" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">ClusterIP only · internal REST /internal/** · no public pod IPs</text>
  <text x="536" y="492" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Node groups = ASG (worker nodes, not app JAR on EC2)</text>

  <!-- RDS -->
  <g filter="url(#s)">
    <rect x="536" y="516" width="560" height="68" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="816" y="546" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#334155">Amazon RDS MySQL 8</text>
    <text x="816" y="568" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">account_db · wallet_db · payment_db · settlement_db</text>
  </g>

  <!-- Secrets side -->
  <g filter="url(#s)">
    <rect x="488" y="640" width="200" height="80" rx="10" fill="#fff" stroke="#f59e0b"/>
    <text x="588" y="672" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#b45309">Secrets Manager</text>
    <text x="588" y="696" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">JWT · DB · internal API key</text>
  </g>
  <text x="708" y="688" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">’ External Secrets ’ pod env (Helm)</text>

  <!-- CI/CD strip -->
  <rect x="48" y="740" width="1104" height="220" rx="14" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="72" y="776" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#0b1220">CI/CD (single deploy path)</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <rect x="72" y="800" width="88" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="116" y="826" text-anchor="middle" font-weight="600">Git</text>
    <text x="172" y="826" fill="#94a3b8">’</text>
    <rect x="182" y="800" width="100" height="40" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="232" y="826" text-anchor="middle" font-weight="600" fill="#9d174d">Jenkins</text>
    <text x="296" y="826" fill="#94a3b8">’</text>
    <rect x="306" y="800" width="120" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="366" y="826" text-anchor="middle">mvn test</text>
    <text x="438" y="826" fill="#94a3b8">’</text>
    <rect x="448" y="800" width="130" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="513" y="826" text-anchor="middle" font-weight="600" fill="#5b21b6">SonarQube</text>
    <text x="590" y="826" fill="#94a3b8">’</text>
    <rect x="600" y="800" width="120" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="660" y="826" text-anchor="middle">Docker build</text>
    <text x="732" y="826" fill="#94a3b8">’</text>
    <rect x="742" y="800" width="90" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="787" y="826" text-anchor="middle" font-weight="600" fill="#92400e">Trivy</text>
    <text x="844" y="826" fill="#94a3b8">’</text>
    <rect x="854" y="800" width="88" height="40" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text x="898" y="826" text-anchor="middle" font-weight="600" fill="#c2410c">ECR push</text>
    <text x="954" y="826" fill="#94a3b8">’</text>
    <rect x="964" y="800" width="88" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1008" y="826" text-anchor="middle">Helm</text>
    <text x="1064" y="826" fill="#94a3b8">’</text>
    <rect x="1074" y="800" width="68" height="40" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="1108" y="826" text-anchor="middle" font-weight="600" fill="#b91c1c">Argo CD</text>
  </g>

  <text x="72" y="868" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Jenkins builds &amp; scans · Argo CD deploys only (GitOps) · Ansible for pipeline/bootstrap hosts · Terraform for VPC, EKS, RDS, ALB, ECR</text>
  <text x="72" y="896" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">No S3 java -jar on workers · CloudWatch logs · IRSA for AWS API access</text>

  <!-- Legend -->
  <rect x="48" y="968" width="400" height="24" rx="4" fill="#e0f7fe"/>
  <text x="248" y="985" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0b1220">github.com/suryakant1811/PAYWAVE</text>
</svg>