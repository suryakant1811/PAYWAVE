<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <title>PayWave AWS Target Architecture</title>
  <rect width="1200" height="980" fill="#f8fafc"/>
  <rect width="1200" height="6" fill="#00baf2"/>
  <text x="48" y="46" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold" fill="#0b1220">PayWave on AWS</text>
  <text x="48" y="78" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Terraform, EKS, RDS, ECR, Jenkins, SonarQube, Trivy, Argo CD, Helm</text>

  <rect x="48" y="112" width="170" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="133" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#0b1220">Users</text>
  <text x="133" y="164" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b">HTTPS xyz.com</text>

  <line x1="218" y1="146" x2="268" y2="146" stroke="#64748b" stroke-width="2"/>
  <polygon points="268,146 258,141 258,151" fill="#64748b"/>

  <rect x="268" y="102" width="130" height="88" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="333" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#e65100">Route 53</text>
  <text x="333" y="158" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">DNS + ACM TLS</text>

  <line x1="398" y1="146" x2="458" y2="146" stroke="#64748b" stroke-width="2"/>
  <polygon points="458,146 448,141 448,151" fill="#64748b"/>

  <rect x="458" y="96" width="682" height="500" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="482" y="126" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#312e81">VPC (Terraform)</text>
  <text x="482" y="148" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">2 public + 2 private subnets, IGW, NAT</text>

  <rect x="482" y="168" width="634" height="90" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="502" y="194" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#166534">Public subnets</text>
  <rect x="550" y="204" width="220" height="44" rx="6" fill="#ffffff" stroke="#22c55e"/>
  <text x="660" y="232" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#0b1220">Application Load Balancer</text>

  <rect x="482" y="278" width="634" height="298" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="502" y="306" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#312e81">Private subnets - Amazon EKS</text>

  <rect x="506" y="322" width="140" height="48" rx="6" fill="#e0f7fe" stroke="#00baf2" stroke-width="2"/>
  <text x="576" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0b1220">Ingress</text>

  <line x1="646" y1="346" x2="686" y2="346" stroke="#64748b" stroke-width="2"/>
  <polygon points="686,346 676,341 676,351" fill="#64748b"/>

  <rect x="686" y="318" width="170" height="56" rx="6" fill="#e0f7fe" stroke="#00baf2" stroke-width="2"/>
  <text x="771" y="344" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#0b1220">api-gateway</text>
  <text x="771" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">embedded demo UI</text>

  <rect x="506" y="396" width="108" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="422" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">account x2</text>
  <rect x="626" y="396" width="108" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="680" y="422" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">wallet x2</text>
  <rect x="746" y="396" width="108" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="800" y="422" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">payment x2</text>
  <rect x="866" y="396" width="108" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="920" y="422" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">settlement x2</text>

  <text x="506" y="462" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">ClusterIP only; internal /internal/** calls; node group = worker ASG</text>

  <rect x="506" y="480" width="590" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="801" y="508" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#334155">Amazon RDS MySQL 8</text>
  <text x="801" y="528" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">account_db, wallet_db, payment_db, settlement_db</text>

  <rect x="458" y="618" width="190" height="76" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="553" y="648" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#b45309">Secrets Manager</text>
  <text x="553" y="672" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">JWT, DB, internal API key</text>

  <rect x="48" y="720" width="1092" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="72" y="754" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#0b1220">CI/CD (single path)</text>

  <text x="72" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#0b1220">Git</text>
  <text x="110" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b">-&gt;</text>
  <text x="132" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#9d174d" font-weight="bold">Jenkins</text>
  <text x="200" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b">-&gt; mvn test -&gt;</text>
  <text x="310" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5b21b6" font-weight="bold">SonarQube</text>
  <text x="400" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b">-&gt; Docker -&gt;</text>
  <text x="490" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#92400e" font-weight="bold">Trivy</text>
  <text x="540" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b">-&gt;</text>
  <text x="560" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#c2410c" font-weight="bold">ECR</text>
  <text x="600" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b">-&gt; Helm (Git) -&gt;</text>
  <text x="720" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#b91c1c" font-weight="bold">Argo CD</text>
  <text x="800" y="798" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b">-&gt; EKS</text>

  <text x="72" y="836" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Jenkins builds and scans; Argo CD deploys only. Ansible for Jenkins or Sonar hosts. No S3 java -jar on workers.</text>
  <text x="72" y="864" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#94a3b8">CloudWatch logs - IRSA for AWS access</text>

  <rect x="48" y="920" width="380" height="28" rx="4" fill="#e0f7fe"/>
  <text x="238" y="940" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b1220">github.com/suryakant1811/PAYWAVE</text>
</svg>