<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100">
  <title>PayWave Full AWS Architecture</title>
  <rect width="1400" height="1100" fill="#ffffff"/>
  <rect width="1400" height="56" fill="#232f3e"/>
  <text x="48" y="36" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">PayWave on AWS - full architecture to build</text>
  <text x="1350" y="36" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#aab7b8">Terraform + EKS + RDS + CI/CD</text>

  <!-- Users -->
  <circle cx="88" cy="120" r="28" fill="#ff9900" stroke="#232f3e" stroke-width="2"/>
  <text x="88" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232f3e">User</text>
  <text x="88" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#232f3e">Users</text>

  <!-- Step 1 Route53 ACM -->
  <circle cx="200" cy="108" r="14" fill="#232f3e"/>
  <text x="200" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <rect x="148" y="128" width="130" height="72" rx="6" fill="#fff9e6" stroke="#ff9900" stroke-width="1.5"/>
  <text x="213" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232f3e">Route 53</text>
  <text x="213" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">xyz.com</text>
  <text x="213" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">ACM TLS</text>

  <line x1="116" y1="120" x2="145" y2="150" stroke="#545b64" stroke-width="1.5"/>
  <line x1="278" y1="164" x2="318" y2="164" stroke="#545b64" stroke-width="1.5"/>

  <!-- Customer VPC boundary -->
  <rect x="318" y="88" width="1040" height="760" rx="8" fill="#f2f8fd" stroke="#0073bb" stroke-width="2"/>
  <text x="338" y="118" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0073bb">Customer VPC (10.0.0.0/16) - Terraform</text>
  <text x="1050" y="118" font-family="Arial,sans-serif" font-size="11" fill="#545b64">Region e.g. ap-south-1</text>

  <!-- IGW -->
  <rect x="338" y="140" width="120" height="56" rx="6" fill="#ffffff" stroke="#232f3e"/>
  <text x="398" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232f3e">Internet</text>
  <text x="398" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">Gateway</text>

  <!-- Public subnet block -->
  <rect x="338" y="210" width="1000" height="130" rx="6" fill="#e9f5e0" stroke="#1d8102" stroke-width="1.5"/>
  <text x="358" y="234" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1d8102">Public subnets (2 AZ)</text>
  <text x="358" y="252" font-family="Arial,sans-serif" font-size="10" fill="#545b64">10.0.1.0/24 AZ-a, 10.0.2.0/24 AZ-b, route to IGW</text>

  <circle cx="430" cy="278" r="14" fill="#232f3e"/>
  <text x="430" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <rect x="458" y="260" width="200" height="60" rx="6" fill="#ffffff" stroke="#1d8102"/>
  <text x="558" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232f3e">Application Load Balancer</text>
  <text x="558" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">HTTPS :443 only</text>

  <rect x="700" y="260" width="160" height="60" rx="6" fill="#ffffff" stroke="#545b64"/>
  <text x="780" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232f3e">NAT Gateway</text>
  <text x="780" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">+ Elastic IP</text>

  <!-- Private subnet block -->
  <rect x="338" y="360" width="1000" height="380" rx="6" fill="#e8f4fc" stroke="#0073bb" stroke-width="1.5"/>
  <text x="358" y="384" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0073bb">Private subnets (2 AZ)</text>
  <text x="358" y="402" font-family="Arial,sans-serif" font-size="10" fill="#545b64">10.0.11.0/24, 10.0.12.0/24, route to NAT</text>

  <!-- EKS box -->
  <rect x="358" y="420" width="620" height="300" rx="6" fill="#ffffff" stroke="#0073bb" stroke-width="2"/>
  <text x="378" y="448" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0073bb">Amazon EKS cluster</text>

  <circle cx="410" cy="478" r="14" fill="#232f3e"/>
  <text x="410" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <rect x="432" y="462" width="120" height="48" rx="5" fill="#e0f7fe" stroke="#00baf2"/>
  <text x="492" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232f3e">Ingress</text>

  <circle cx="590" cy="478" r="14" fill="#232f3e"/>
  <text x="590" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <rect x="612" y="458" width="150" height="56" rx="5" fill="#e0f7fe" stroke="#00baf2" stroke-width="2"/>
  <text x="687" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232f3e">api-gateway</text>
  <text x="687" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#545b64">demo UI in image</text>

  <circle cx="410" cy="548" r="14" fill="#232f3e"/>
  <text x="410" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">5</text>
  <text x="378" y="576" font-family="Arial,sans-serif" font-size="11" fill="#545b64">ClusterIP pods (x2 each):</text>
  <rect x="432" y="540" width="102" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="483" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold">account</text>
  <rect x="548" y="540" width="102" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="599" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold">wallet</text>
  <rect x="664" y="540" width="102" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="715" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold">payment</text>
  <rect x="780" y="540" width="102" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="831" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold">settlement</text>

  <rect x="432" y="600" width="330" height="90" rx="5" fill="#fff5f5" stroke="#ef4444"/>
  <text x="452" y="624" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Argo CD (GitOps)</text>
  <text x="452" y="644" font-family="Arial,sans-serif" font-size="10" fill="#545b64">Watches Helm repo in Git</text>
  <text x="452" y="662" font-family="Arial,sans-serif" font-size="10" fill="#545b64">Syncs Deployments to this cluster</text>
  <text x="452" y="680" font-family="Arial,sans-serif" font-size="10" fill="#545b64">IRSA for AWS Load Balancer Controller</text>

  <!-- RDS -->
  <circle cx="1050" cy="478" r="14" fill="#232f3e"/>
  <text x="1050" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">6</text>
  <rect x="1000" y="420" width="310" height="120" rx="6" fill="#ffffff" stroke="#3b48cc" stroke-width="2"/>
  <text x="1155" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#232f3e">Amazon RDS MySQL 8</text>
  <text x="1155" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">DB subnet group (private only)</text>
  <text x="1155" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">account_db, wallet_db</text>
  <text x="1155" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">payment_db, settlement_db</text>
  <text x="1155" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#545b64">SG: 3306 from EKS only</text>

  <!-- Secrets -->
  <rect x="1000" y="560" width="310" height="80" rx="6" fill="#fff9e6" stroke="#ff9900"/>
  <text x="1155" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232f3e">Secrets Manager</text>
  <text x="1155" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">JWT, DB passwords, INTERNAL_API_KEY</text>
  <text x="1155" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">External Secrets Operator to K8s</text>

  <!-- Ops EC2 optional -->
  <rect x="358" y="760" width="300" height="76" rx="6" fill="#ffffff" stroke="#545b64"/>
  <text x="508" y="788" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232f3e">Optional: EC2 private</text>
  <text x="508" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#545b64">Jenkins, SonarQube (Ansible bootstrap)</text>
  <text x="508" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#545b64">SSM Session Manager, no SSH keys</text>

  <!-- CI/CD strip below VPC -->
  <rect x="48" y="870" width="1310" height="200" rx="8" fill="#fafafa" stroke="#232f3e" stroke-width="1.5"/>
  <text x="72" y="902" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#232f3e">CI/CD and shared services (same region)</text>

  <circle cx="100" cy="940" r="14" fill="#232f3e"/>
  <text x="100" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">7</text>
  <rect x="122" y="922" width="72" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="158" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Git</text>

  <circle cx="230" cy="940" r="14" fill="#232f3e"/>
  <text x="230" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">8</text>
  <rect x="252" y="922" width="100" height="44" rx="5" fill="#fce7f3" stroke="#db2777"/>
  <text x="302" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#9d174d">Jenkins</text>

  <circle cx="380" cy="940" r="14" fill="#232f3e"/>
  <text x="380" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">9</text>
  <rect x="402" y="922" width="120" height="44" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="462" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">SonarQube</text>

  <rect x="548" y="922" width="100" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="598" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Trivy</text>

  <circle cx="690" cy="940" r="14" fill="#232f3e"/>
  <text x="690" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">10</text>
  <rect x="712" y="922" width="88" height="44" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="756" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c2410c">ECR</text>
  <text x="756" y="888" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#545b64">5 repos</text>

  <rect x="830" y="922" width="80" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="870" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Helm</text>

  <circle cx="940" cy="940" r="14" fill="#232f3e"/>
  <text x="940" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">11</text>
  <rect x="962" y="922" width="88" height="44" rx="5" fill="#fee2e2" stroke="#ef4444"/>
  <text x="1006" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">Argo CD</text>

  <rect x="1080" y="922" width="120" height="44" rx="5" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1140" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#312e81">EKS deploy</text>

  <text x="72" y="990" font-family="Arial,sans-serif" font-size="12" fill="#545b64">Terraform also creates: S3 state bucket, DynamoDB lock, IAM roles, security groups, CloudWatch log groups</text>
  <text x="72" y="1016" font-family="Arial,sans-serif" font-size="11" fill="#545b64">Ansible: bootstrap Jenkins or Sonar EC2 only. App config: Helm values, not Ansible on pods.</text>
  <text x="72" y="1042" font-family="Arial,sans-serif" font-size="11" fill="#0073bb">docs/aws-architecture.md | github.com/suryakant1811/PAYWAVE</text>

  <!-- arrows ALB to ingress -->
  <line x1="658" y1="290" x2="658" y2="358" stroke="#545b64" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="658" y1="358" x2="492" y2="458" stroke="#545b64" stroke-width="1.5"/>
  <polygon points="492,458 500,452 500,464" fill="#545b64"/>
  <line x1="831" y1="580" x2="1000" y2="480" stroke="#545b64" stroke-width="1.5"/>
</svg>