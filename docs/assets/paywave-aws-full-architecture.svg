<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <title>PayWave complete AWS architecture</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#232f3e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #232f3e; }
      .title { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 17px; font-weight: 700; }
      .h3 { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; }
      .small { font-size: 10px; fill: #545b64; }
      .flow { fill: none; stroke: #232f3e; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #1f80a9; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f2f3f3"/>
  <rect x="25" y="20" width="1550" height="1080" rx="22" fill="#ffffff" stroke="#232f3e" stroke-width="3"/>
  <rect x="25" y="20" width="78" height="64" fill="#232f3e"/>
  <text x="64" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">aws</text>
  <text x="125" y="60" class="title">AWS Cloud - PayWave Production Architecture</text>
  <text x="1535" y="58" text-anchor="end" class="body">ap-south-1 | Terraform managed</text>

  <!-- External services -->
  <g>
    <circle cx="92" cy="172" r="38" fill="#8c4fff"/>
    <circle cx="92" cy="160" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M70 190 Q92 168 114 190" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="92" y="225" text-anchor="middle" class="h3">Users</text>

    <rect x="165" y="130" width="112" height="84" rx="8" fill="#8c4fff"/>
    <circle cx="221" cy="162" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M208 160 L218 170 L237 148" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="221" y="232" text-anchor="middle" class="h3">Route 53</text>
    <text x="221" y="248" text-anchor="middle" class="small">paywave.example.com</text>

    <rect x="315" y="130" width="112" height="84" rx="8" fill="#dd344c"/>
    <path d="M343 174 h56 M350 160 h42 M360 146 h22" stroke="#ffffff" stroke-width="4"/>
    <text x="371" y="232" text-anchor="middle" class="h3">AWS WAF</text>
    <text x="371" y="248" text-anchor="middle" class="small">optional</text>
  </g>
  <path d="M130 172 H165" class="flow"/>
  <path d="M277 172 H315" class="flow"/>

  <!-- VPC -->
  <rect x="465" y="100" width="1070" height="780" fill="#fbfdf8" stroke="#3f8624" stroke-width="3"/>
  <rect x="465" y="100" width="58" height="58" fill="#3f8624"/>
  <path d="M478 133 Q494 113 510 133 Q503 143 494 143 Q485 143 478 133" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="540" y="137" class="h2" fill="#3f8624">VPC 10.0.0.0/16</text>
  <text x="1505" y="136" text-anchor="end" class="body">2 Availability Zones | 4 subnets</text>

  <!-- IGW and ALB -->
  <g>
    <circle cx="520" cy="210" r="39" fill="#f58536"/>
    <path d="M496 216 Q520 188 544 216 Q538 228 526 228 H507 Q498 228 496 216" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="520" y="264" text-anchor="middle" class="h3">Internet Gateway</text>

    <circle cx="710" cy="210" r="39" fill="#f58536"/>
    <rect x="687" y="193" width="46" height="10" fill="#ffffff"/>
    <rect x="695" y="210" width="10" height="14" fill="#ffffff"/>
    <rect x="715" y="210" width="10" height="14" fill="#ffffff"/>
    <path d="M700 203 V210 M720 203 V210" stroke="#ffffff" stroke-width="3"/>
    <text x="710" y="264" text-anchor="middle" class="h3">Application Load Balancer</text>
    <text x="710" y="280" text-anchor="middle" class="small">HTTPS :443 | ACM certificate</text>
  </g>
  <path d="M427 172 H480" class="flow"/>
  <path d="M560 210 H670" class="flow"/>

  <!-- Availability Zones -->
  <rect x="495" y="310" width="485" height="535" class="dash"/>
  <text x="520" y="340" class="h2" fill="#1f80a9">Availability Zone 1 - ap-south-1a</text>
  <rect x="1005" y="310" width="500" height="535" class="dash"/>
  <text x="1030" y="340" class="h2" fill="#1f80a9">Availability Zone 2 - ap-south-1b</text>

  <!-- Public subnets -->
  <rect x="520" y="370" width="435" height="160" fill="#e8f3e3" stroke="#7aa35a" stroke-width="2"/>
  <rect x="520" y="370" width="54" height="54" fill="#3f8624"/>
  <path d="M537 405 v-15 a10 10 0 0 1 20 0 v15 M533 405 h28 v18 h-28z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="590" y="402" class="h2" fill="#3f8624">Public subnet 1</text>
  <text x="590" y="423" class="body">10.0.1.0/24</text>

  <rect x="1030" y="370" width="450" height="160" fill="#e8f3e3" stroke="#7aa35a" stroke-width="2"/>
  <rect x="1030" y="370" width="54" height="54" fill="#3f8624"/>
  <path d="M1047 405 v-15 a10 10 0 0 1 20 0 v15 M1043 405 h28 v18 h-28z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="1100" y="402" class="h2" fill="#3f8624">Public subnet 2</text>
  <text x="1100" y="423" class="body">10.0.2.0/24</text>

  <!-- NAT gateways -->
  <g>
    <rect x="680" y="442" width="68" height="58" fill="#f58536"/>
    <path d="M697 473 h34 M714 456 v34 M699 460 l15-8 15 8 M699 486 l15 8 15-8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="770" y="468" class="h3">NAT Gateway</text>
    <text x="770" y="486" class="small">Elastic IP</text>
    <rect x="1195" y="442" width="68" height="58" fill="#f58536"/>
    <path d="M1212 473 h34 M1229 456 v34 M1214 460 l15-8 15 8 M1214 486 l15 8 15-8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="1285" y="468" class="h3">NAT Gateway</text>
    <text x="1285" y="486" class="small">Prod HA (optional in dev)</text>
  </g>
  <path d="M710 249 V360 H714 V442" class="flow"/>
  <path d="M710 360 H1229 V442" class="flow"/>

  <!-- Private subnets -->
  <rect x="520" y="560" width="435" height="250" fill="#e4eff7" stroke="#2e73a8" stroke-width="2"/>
  <rect x="520" y="560" width="54" height="54" fill="#2e73a8"/>
  <path d="M537 595 v-15 a10 10 0 0 1 20 0 v15 M533 595 h28 v18 h-28z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="590" y="592" class="h2" fill="#2e73a8">Private subnet 1</text>
  <text x="590" y="613" class="body">10.0.11.0/24</text>

  <rect x="1030" y="560" width="450" height="250" fill="#e4eff7" stroke="#2e73a8" stroke-width="2"/>
  <rect x="1030" y="560" width="54" height="54" fill="#2e73a8"/>
  <path d="M1047 595 v-15 a10 10 0 0 1 20 0 v15 M1043 595 h28 v18 h-28z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="1100" y="592" class="h2" fill="#2e73a8">Private subnet 2</text>
  <text x="1100" y="613" class="body">10.0.12.0/24</text>

  <!-- EKS worker nodes -->
  <g>
    <rect x="640" y="650" width="190" height="115" rx="8" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
    <rect x="655" y="668" width="58" height="58" fill="#8c4fff"/>
    <polygon points="684,677 703,688 703,710 684,721 665,710 665,688" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="730" y="692" class="h3">EKS worker node</text>
    <text x="730" y="711" class="small">Gateway + services</text>
    <text x="730" y="730" class="small">Managed node group</text>

    <rect x="1155" y="650" width="190" height="115" rx="8" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
    <rect x="1170" y="668" width="58" height="58" fill="#8c4fff"/>
    <polygon points="1199,677 1218,688 1218,710 1199,721 1180,710 1180,688" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="1245" y="692" class="h3">EKS worker node</text>
    <text x="1245" y="711" class="small">Gateway + services</text>
    <text x="1245" y="730" class="small">Managed node group</text>
  </g>
  <path d="M710 249 V620 H735 V650" class="flow"/>
  <path d="M710 620 H1250 V650" class="flow"/>

  <!-- RDS + Secrets -->
  <g>
    <rect x="1360" y="640" width="78" height="78" fill="#3b48cc"/>
    <ellipse cx="1399" cy="660" rx="22" ry="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M1377 660 v30 c0 12 44 12 44 0 v-30" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="1399" y="742" text-anchor="middle" class="h3">RDS MySQL</text>
    <text x="1399" y="759" text-anchor="middle" class="small">4 schemas</text>

    <rect x="1360" y="180" width="78" height="78" fill="#dd344c"/>
    <circle cx="1399" cy="212" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M1399 226 v18 M1399 238 h16" stroke="#ffffff" stroke-width="3"/>
    <text x="1399" y="280" text-anchor="middle" class="h3">Secrets Manager</text>
    <text x="1399" y="297" text-anchor="middle" class="small">JWT, DB, API key</text>
  </g>
  <path d="M1345 708 H1360" class="flow"/>

  <!-- CI/CD -->
  <rect x="75" y="920" width="1450" height="140" rx="8" fill="#f7f7f7" stroke="#8a8d90" stroke-width="2"/>
  <text x="100" y="952" class="h2">CI/CD and GitOps</text>
  <g>
    <rect x="115" y="975" width="120" height="58" rx="6" fill="#24292f"/>
    <text x="175" y="1010" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GitHub</text>
    <rect x="285" y="975" width="120" height="58" rx="6" fill="#d33833"/>
    <text x="345" y="1010" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Jenkins</text>
    <rect x="455" y="975" width="120" height="58" rx="6" fill="#4e9bba"/>
    <text x="515" y="1002" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Maven</text>
    <text x="515" y="1018" text-anchor="middle" font-size="10" fill="#ffffff">test + package</text>
    <rect x="625" y="975" width="120" height="58" rx="6" fill="#4e9bba"/>
    <text x="685" y="1010" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SonarQube</text>
    <rect x="795" y="975" width="120" height="58" rx="6" fill="#0f7c90"/>
    <text x="855" y="1002" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Docker + Trivy</text>
    <text x="855" y="1018" text-anchor="middle" font-size="10" fill="#ffffff">build + scan</text>
    <rect x="965" y="975" width="120" height="58" rx="6" fill="#f58536"/>
    <text x="1025" y="1010" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Amazon ECR</text>
    <rect x="1135" y="975" width="120" height="58" rx="6" fill="#0f7c90"/>
    <text x="1195" y="1010" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Helm Git</text>
    <rect x="1305" y="975" width="120" height="58" rx="6" fill="#ef7b4d"/>
    <text x="1365" y="1010" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Argo CD</text>
  </g>
  <path d="M235 1004 H285 M405 1004 H455 M575 1004 H625 M745 1004 H795 M915 1004 H965 M1085 1004 H1135 M1255 1004 H1305" class="flow"/>
  <path d="M1365 975 V865 H830 V765" class="flow"/>

  <text x="800" y="1090" text-anchor="middle" class="small">Only the ALB is public. EKS nodes and RDS stay in private subnets. Jenkins builds; Argo CD deploys.</text>
</svg>