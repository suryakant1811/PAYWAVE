<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>PayWave Application Architecture</title>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect width="1200" height="112" fill="#d9f4fd"/>
  <text x="48" y="52" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" fill="#0b1220">PayWave</text>
  <text x="48" y="86" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569">Digital wallet and payments - Java 21 - Spring Boot microservices</text>

  <rect x="48" y="150" width="160" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="128" y="188" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#0b1220">Clients</text>
  <text x="128" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b">Browser / Mobile / API</text>

  <line x1="208" y1="193" x2="258" y2="193" stroke="#475569" stroke-width="2"/>
  <polygon points="258,193 248,188 248,198" fill="#475569"/>
  <text x="233" y="182" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">HTTPS</text>

  <rect x="268" y="138" width="200" height="120" rx="10" fill="#e0f7fe" stroke="#00baf2" stroke-width="2"/>
  <text x="368" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#0b1220">api-gateway</text>
  <text x="368" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569">:8080 public entry</text>
  <text x="368" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">JWT, rate limit, routing</text>
  <text x="368" y="244" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0891b2">Demo UI at /</text>

  <line x1="468" y1="193" x2="508" y2="193" stroke="#475569" stroke-width="2"/>
  <polygon points="508,193 498,188 498,198" fill="#475569"/>

  <rect x="520" y="148" width="148" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="594" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0b1220">account</text>
  <text x="594" y="196" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">:8081</text>
  <text x="594" y="218" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">auth, profile, notify</text>

  <rect x="688" y="148" width="148" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="762" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0b1220">wallet</text>
  <text x="762" y="196" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">:8082</text>
  <text x="762" y="218" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">balance + ledger</text>

  <rect x="856" y="148" width="148" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="930" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0b1220">payment</text>
  <text x="930" y="196" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">:8083</text>
  <text x="930" y="218" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">pay, merchant, refund</text>

  <rect x="1024" y="148" width="128" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1088" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#0b1220">settlement</text>
  <text x="1088" y="196" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">:8084</text>
  <text x="1088" y="218" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">merchant payout</text>

  <line x1="594" y1="252" x2="594" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="520" y="288" width="148" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="594" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#334155">account_db</text>

  <line x1="762" y1="252" x2="762" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="688" y="288" width="148" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="762" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#334155">wallet_db</text>

  <line x1="930" y1="252" x2="930" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="856" y="288" width="148" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="930" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#334155">payment_db</text>

  <line x1="1088" y1="252" x2="1088" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="1024" y="288" width="128" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1088" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#334155">settlement_db</text>

  <rect x="48" y="380" width="1104" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="72" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#0b1220">Communication</text>
  <text x="72" y="438" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Internal sync: REST /internal/** with X-Internal-Api-Key (blocked at gateway)</text>
  <text x="72" y="462" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Optional async: outbox to account notifications (PAYWAVE_MESSAGING_MODE=http)</text>
  <text x="72" y="498" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155">User journey:</text>
  <text x="72" y="528" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0b1220">Register - Login - Top-up - Transfer - Pay merchant - Refund - Settlement</text>
  <text x="72" y="564" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155">account</text>
  <text x="130" y="564" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b">calls wallet on signup</text>
  <text x="72" y="592" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155">payment / settlement</text>
  <text x="220" y="592" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b">call wallet (money) and payment (settlement)</text>
  <text x="72" y="652" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#94a3b8">Simulated payments only - not linked to real banks or UPI</text>
</svg>