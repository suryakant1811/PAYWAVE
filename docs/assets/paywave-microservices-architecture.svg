<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <title>PayWave microservices in AWS style</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#232f3e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#232f3e}.h1{font-size:24px;font-weight:700}.h2{font-size:17px;font-weight:700}.h3{font-size:13px;font-weight:700}.b{font-size:11px}.s{font-size:10px;fill:#545b64}.f{fill:none;stroke:#232f3e;stroke-width:2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1500" height="820" fill="#f2f3f3"/>
  <rect x="25" y="20" width="1450" height="770" rx="20" fill="#fff" stroke="#232f3e" stroke-width="3"/>
  <rect x="25" y="20" width="78" height="64" fill="#232f3e"/>
  <text x="64" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">aws</text>
  <text x="125" y="60" class="h1">PayWave Application Architecture</text>
  <text x="1435" y="58" text-anchor="end" class="b">Java 21 | Spring Boot | MySQL 8</text>

  <circle cx="105" cy="180" r="38" fill="#8c4fff"/>
  <circle cx="105" cy="168" r="10" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M82 198 Q105 174 128 198" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="105" y="234" text-anchor="middle" class="h3">Customer</text>

  <circle cx="265" cy="180" r="40" fill="#f58536"/>
  <rect x="242" y="163" width="46" height="10" fill="#fff"/>
  <rect x="250" y="180" width="10" height="14" fill="#fff"/>
  <rect x="270" y="180" width="10" height="14" fill="#fff"/>
  <text x="265" y="234" text-anchor="middle" class="h3">API Gateway :8080</text>
  <text x="265" y="250" text-anchor="middle" class="s">JWT, routing, rate limits, UI</text>
  <path d="M143 180 H225" class="f"/>

  <rect x="370" y="105" width="1050" height="610" fill="#fbfdf8" stroke="#3f8624" stroke-width="3"/>
  <rect x="370" y="105" width="56" height="56" fill="#3f8624"/>
  <path d="M383 137 Q398 117 413 137 Q407 148 398 148 Q389 148 383 137" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="445" y="140" class="h2" fill="#3f8624">PayWave private application network</text>

  <rect x="410" y="190" width="970" height="250" fill="#e4eff7" stroke="#2e73a8" stroke-width="2"/>
  <text x="435" y="220" class="h2" fill="#2e73a8">Spring Boot services (private)</text>

  <!-- service cards -->
  <g>
    <rect x="445" y="255" width="195" height="125" rx="8" fill="#fff" stroke="#f58536" stroke-width="2"/>
    <rect x="460" y="273" width="58" height="58" fill="#f58536"/>
    <path d="M473 316 v-27 h32 v27 M480 289 v-8 h18 v8" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="532" y="286" class="h3">account-service</text><text x="532" y="306" class="s">:8081</text>
    <text x="465" y="356" class="b">Auth, profile, KYC, notify</text>

    <rect x="670" y="255" width="195" height="125" rx="8" fill="#fff" stroke="#f58536" stroke-width="2"/>
    <rect x="685" y="273" width="58" height="58" fill="#f58536"/>
    <rect x="698" y="289" width="32" height="25" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M704 289 v-7 h20 v7 M717 298 h9" stroke="#fff" stroke-width="3"/>
    <text x="757" y="286" class="h3">wallet-service</text><text x="757" y="306" class="s">:8082</text>
    <text x="690" y="356" class="b">Balances + double-entry ledger</text>

    <rect x="895" y="255" width="210" height="125" rx="8" fill="#fff" stroke="#f58536" stroke-width="2"/>
    <rect x="910" y="273" width="58" height="58" fill="#f58536"/>
    <path d="M923 300 h32 M939 284 v32 M924 287 l15-8 15 8 M924 313 l15 8 15-8" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="982" y="286" class="h3">payment-service</text><text x="982" y="306" class="s">:8083</text>
    <text x="915" y="356" class="b">Top-up, transfer, merchant, refund</text>

    <rect x="1135" y="255" width="210" height="125" rx="8" fill="#fff" stroke="#f58536" stroke-width="2"/>
    <rect x="1150" y="273" width="58" height="58" fill="#f58536"/>
    <path d="M1163 286 h32 v30 h-32z M1169 292 h20 M1169 300 h20 M1169 308 h14" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="1222" y="286" class="h3">settlement-service</text><text x="1222" y="306" class="s">:8084</text>
    <text x="1155" y="356" class="b">Merchant daily payout + report</text>
  </g>
  <path d="M305 180 H390 V315 H445" class="f"/>
  <path d="M640 318 H670 M865 318 H895 M1105 318 H1135" class="f"/>

  <!-- Databases -->
  <rect x="410" y="475" width="970" height="190" fill="#f1efff" stroke="#8c4fff" stroke-width="2"/>
  <text x="435" y="505" class="h2" fill="#5f3dc4">Data ownership - one schema per service</text>
  <g>
    <rect x="465" y="535" width="58" height="58" fill="#3b48cc"/>
    <ellipse cx="494" cy="550" rx="16" ry="6" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M478 550 v22 c0 9 32 9 32 0 v-22" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="494" y="618" text-anchor="middle" class="h3">account_db</text>
    <rect x="690" y="535" width="58" height="58" fill="#3b48cc"/>
    <ellipse cx="719" cy="550" rx="16" ry="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M703 550 v22 c0 9 32 9 32 0 v-22" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="719" y="618" text-anchor="middle" class="h3">wallet_db</text>
    <rect x="930" y="535" width="58" height="58" fill="#3b48cc"/>
    <ellipse cx="959" cy="550" rx="16" ry="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M943 550 v22 c0 9 32 9 32 0 v-22" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="959" y="618" text-anchor="middle" class="h3">payment_db</text>
    <rect x="1170" y="535" width="58" height="58" fill="#3b48cc"/>
    <ellipse cx="1199" cy="550" rx="16" ry="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M1183 550 v22 c0 9 32 9 32 0 v-22" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="1199" y="618" text-anchor="middle" class="h3">settlement_db</text>
  </g>

  <text x="750" y="755" text-anchor="middle" class="b">Internal REST: /internal/** + X-Internal-Api-Key | Events: transactional outbox to account notifications</text>
</svg>