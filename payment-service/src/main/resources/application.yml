server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service
  config:
    import: optional:classpath:paywave-resilience.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:paywave}
    password: ${DB_PASSWORD:paywave_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

paywave:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-paywave-jwt-secret-change-me-32b}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}
    cors-origins: ${CORS_ORIGINS:*}
    public-paths: []
  payments:
    min-amount: 1.00
    max-amount: 100000.00
    merchant-fee-rate: 0.015
    decline-cents: 13
    timeout-cents: 14
  refunds:
    auto-approve-threshold: ${REFUND_AUTO_APPROVE_THRESHOLD:5000.00}
  clients:
    account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
    wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8082}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
  messaging:
    mode: ${PAYWAVE_MESSAGING_MODE:log}
    relay-delay-ms: 2000
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
