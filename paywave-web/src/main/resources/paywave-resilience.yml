resilience4j:
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.paywave.common.error.PaywaveException
    instances:
      authService:
        baseConfig: default
      userService:
        baseConfig: default
      walletService:
        baseConfig: default
      ledgerService:
        baseConfig: default
      paymentService:
        baseConfig: default
      transactionService:
        baseConfig: default
      merchantService:
        baseConfig: default
      notificationService:
        baseConfig: default
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.paywave.common.error.PaywaveException
    instances:
      authService:
        baseConfig: default
      userService:
        baseConfig: default
      walletService:
        baseConfig: default
      ledgerService:
        baseConfig: default
      paymentService:
        baseConfig: default
      transactionService:
        baseConfig: default
      merchantService:
        baseConfig: default
      notificationService:
        baseConfig: default
